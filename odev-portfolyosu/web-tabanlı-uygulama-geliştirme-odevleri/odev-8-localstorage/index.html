<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuhammedEdev | Portal v8</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">MuhammedEdev</div>
            <button id="theme-toggle" onclick="toggleTheme()">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

        <section class="app-content">
            <h2><i class="fa-solid fa-cart-shopping"></i> Alışveriş Listesi</h2>
            <p class="subtitle">Verileriniz Local Storage ile tarayıcıda saklanır.</p>
            
            <div class="input-group">
                <input type="text" id="item-input" placeholder="Listeye bir ürün ekle...">
                <button class="add-btn" onclick="addItem()">Ekle</button>
            </div>

            <ul id="item-list">
                </ul>

            <button class="clear-all" onclick="clearList()">
                <i class="fa-solid fa-trash-can"></i> Listeyi Temizle
            </button>
        </section>
        
        <div class="footer-note">
            * JSON.stringify ve parse işlemleri yapılmıştır.
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
